name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:      # Actions tab > build > Run workflow, then download the wordPass.nds artifact

permissions:
  contents: write

# Keep only the latest validation for a moving pull request. Do not interrupt
# main-branch builds or tagged release jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The same checks as `make check` locally, plus the generated-file drift checks, the guide check and the Python tools.
    # Native rule tests need only gcc and Python; no toolchain container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rule tests, data tests and generated-file drift (make check)
        # settings, languages (all thirty data files), interface text, board and music rules, the balance bot self-test,
        # source/songs.c against its generator, source/ui_strings.c/.h against ui_strings.tsv, the settingsSave() sites
        run: make check
      - name: Written guide against the code and the data (tools/check_guide.py)
        run: python3 tools/check_guide.py
      - name: Tracked music renders against a fresh render (make music-check)
        run: make music-check
      - name: Python tools compile
        run: python3 -m py_compile tools/*.py tools/emu/*.py tools/lang/*.py tools/music/*.py tools/check/*.py
      - name: Verify deterministic ROM-set packaging (no DS toolchain)
        run: python3 tools/check/package_roms.py --selftest
      - name: Generate actionable 11-language audit report
        run: python3 tools/lang/quality_report.py build/language-quality.md
      - name: Upload localization QA report
        uses: actions/upload-artifact@v7
        with:
          name: wordPass-language-quality
          path: build/language-quality.md

  nds:
    needs: check
    runs-on: ubuntu-latest
    # Pinned: ROMs from this image boot in DeSmuME as well as melonDS and hardware.
    # devkitpro/devkitarm:latest (libnds 2 / calico) also builds but needs melonDS or hardware.
    container: devkitpro/devkitarm:20240511
    steps:
      - uses: actions/checkout@v7
      - name: Build ROM
        run: make
      - name: Check the ROM exists and carries the ten languages
        run: |
          ls -l wordPass.nds
          test "$(find nitrofiles/lang -name '*.bin' | wc -l)" -eq 30
          test "$(ls nitrofiles/lang | wc -l)" -eq 10
          grep -aq 'letters.bin' wordPass.nds
      - name: Retail linked-memory and ROM budget
        run: python3 tools/check/rom_budget.py --rom wordPass.nds --elf wordPass.elf --mode retail --nm "$DEVKITARM/bin/arm-none-eabi-nm" --forbid-float-printf --output build/rom-budget-retail.json
      - name: Upload ROM
        uses: actions/upload-artifact@v7
        with:
          name: wordPass
          path: |
            wordPass.nds
            wordPass.elf
            build/rom-budget-retail.json
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: wordPass.nds
      - name: Build separate Cyrillic engineering preview ROM
        run: |
          cp wordPass.nds wordPass-retail.nds
          make clean
          make WP_CYR_PREVIEW=1
          test -f nitrofiles/cyrpreview/ru/dict.bin
          test -f nitrofiles/cyrpreview/uk/pools.bin
          mv wordPass.nds wordPass-cyr-preview.nds
          mv wordPass.elf wordPass-cyr-preview.elf
      - name: Preview linked-memory and ROM budget
        run: python3 tools/check/rom_budget.py --rom wordPass-cyr-preview.nds --elf wordPass-cyr-preview.elf --mode preview --preview-root nitrofiles/cyrpreview --nm "$DEVKITARM/bin/arm-none-eabi-nm" --forbid-float-printf --output build/rom-budget-preview.json
      - name: Upload Cyrillic engineering preview ROM (NOT a release)
        uses: actions/upload-artifact@v7
        with:
          name: wordPass-cyr-preview
          path: |
            wordPass-cyr-preview.nds
            wordPass-cyr-preview.elf
            build/rom-budget-preview.json
      - name: Create verified, labeled retail and preview ROM ZIP
        run: |
          python3 tools/check/package_roms.py \
            --retail wordPass-retail.nds \
            --preview wordPass-cyr-preview.nds \
            --output wordPass-ROM-set.zip \
            --commit "$GITHUB_SHA"
          python3 tools/check/package_roms.py --verify wordPass-ROM-set.zip
          sha256sum --check wordPass-ROM-set.sha256
      - name: Upload full ROM-set ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: wordPass-complete-ROM-set
          path: |
            wordPass-ROM-set.zip
            wordPass-ROM-set.sha256

  emulator:
    # Boots the built ROM headless in DeSmuME (py-desmume is a binary wheel with its own SDL2, so pip alone is enough;
    # local GNU binutils read symbols and DWARF member offsets from the matching built ELF).
    needs: nds
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wordPass
      - name: Install py-desmume, Pillow and numpy
        run: python3 -m pip install py-desmume pillow numpy
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-cyr-preview
      - name: Smoke test
        run: python3 tools/emu/smoke.py wordPass.nds smoke-out
      - name: FAT card saves, reboots and damaged language fallback
        timeout-minutes: 12
        run: python3 tools/emu/test_fat.py wordPass.nds wordPass.elf fat-out
      - name: Real DS Cyrillic preview touch, chain, peel, switch and exit
        run: python3 tools/emu/test_cyr_preview.py wordPass-cyr-preview.nds cyr-preview-out
      - name: Russian and Ukrainian checkpoints survive FAT-card reboot
        timeout-minutes: 12
        run: python3 tools/emu/test_cyr_checkpoint.py wordPass-cyr-preview.nds wordPass-cyr-preview.elf cyr-preview-out/checkpoints
      - name: Play the complete replayable tutorial on DS, every retail language
        timeout-minutes: 12
        run: python3 tools/emu/test_training.py wordPass.nds training-out
      - name: Word clues, goal progress and safe assistance
        timeout-minutes: 12
        run: python3 tools/emu/test_cohesion.py wordPass.nds cohesion-out
      - name: Complete rules, all-language layouts, guide, input and music scenarios
        # Every PR/release candidate now passes the entire suite. This includes
        # the former language/input subsets, so do not run those a second time.
        timeout-minutes: 90
        run: python3 tools/emu/test_rules.py wordPass.nds rules-out
      # Always retain evidence from the emulator, including partially written
      # screenshots when a visual assertion fails. The PNGs are diagnostics,
      # not extra files embedded into the production or Cyrillic DS ROMs.
      - name: Upload emulator screenshot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wordPass-emulator-screenshots
          path: |
            smoke-out/**/*.png
            cyr-preview-out/**/*.png
            fat-out/**/*.png
            rules-out/**/*.png
            cohesion-out/**/*.png
            training-out/**/*.png
          if-no-files-found: ignore
          retention-days: 7
