name: Refresh soundtrack previews

# A one-time repair run for the 2026-11-21 music drift, plus a reusable
# manual refresh action for when the authored song tables change again.
on:
  push:
    branches:
      - fix/wordpass-music-hints-20261121
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render all song WAV and MIDI previews
        run: |
          make music-render
          make music-check
      - name: Commit only updated music previews
        run: |
          git add -- docs/music
          if git diff --cached --quiet; then
            echo "All tracked song previews already match the renderer."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Regenerate deterministic wordPass soundtrack previews"
          git push origin "HEAD:${GITHUB_REF_NAME}"
