name: WordPass sourced Russian and Ukrainian experimental ROM

on:
  pull_request:
    paths:
      - 'data/cyrlex/*_source_candidates.json'
      - 'tools/lang/fetch_cyr_upstream.py'
      - 'tools/lang/import_cyr_hunspell.py'
      - 'tools/lang/audit_sourced_cyr.py'
      - 'tools/lang/install_cyr_preview.py'
      - 'tools/lang/hunspell.py'
      - 'tools/emu/test_cyr_preview.py'
      - 'tools/emu/cyr_lifecycle.py'
      - 'source/script_board.c'
      - 'source/tiles_v2.c'
      - 'source/dict_v4.c'
      - 'source/dict_v4.h'
      - 'source/pools_v2.c'
      - 'tools/lang/dict_v4.py'
      - 'tools/lang/pools_v2.py'
      - 'tools/check/script_pass_test.c'
      - 'source/script_preview.c'
      - 'source/script_preview.h'
      - 'source/script_checkpoint.c'
      - 'source/script_checkpoint.h'
      - 'tools/emu/test_cyr_checkpoint.py'
      - 'tools/emu/test_cyr_training.py'
      - 'source/script_rules.c'
      - 'source/script_rules.h'
      - 'source/script_career.c'
      - 'source/script_career.h'
      - 'source/integrated_guide.h'
      - 'tools/check/script_career_test.c'
      - 'source/main.c'
      - 'source/gfx.c'
      - 'source/game.h'
      - 'source/settings.c'
      - 'source/build_info.h'
      - 'Makefile'
      - 'tools/emu/test_integrated_languages.py'
      - 'experiments/cjk/**'
      - 'tools/check/cjk_records_test.c'
      - 'source/script_career.h'
      - 'tools/emu/test_cjk_integration.py'
      - '.github/workflows/sourced-cyr-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
      - name: Check pinned-source integrity and importer selftests offline
        run: |
          python3 tools/lang/fetch_cyr_upstream.py --selftest
          python3 tools/lang/import_cyr_hunspell.py --selftest build/source-intake-fixtures
          python3 tools/lang/install_cyr_preview.py --selftest build/source-install-fixtures
      - name: Fetch exact LibreOffice source commit with original notices
        run: python3 tools/lang/fetch_cyr_upstream.py --out source-cache
      - name: Import real source-backed Russian dictionary and themed vocabulary
        run: |
          python3 tools/lang/import_cyr_hunspell.py \
            --code ru --dic source-cache/ru_RU/ru_RU.dic \
            --aff source-cache/ru_RU/ru_RU.aff \
            --notice source-cache/ru_RU/README_ru_RU.txt \
            --origin "https://github.com/LibreOffice/dictionaries/tree/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/ru_RU" \
            --extra-themes data/cyrlex/ru_source_candidates.json \
            --sample-words 100000 --out sourced-preview/ru
      - name: Import real source-backed Ukrainian dictionary and themed vocabulary
        run: |
          python3 tools/lang/import_cyr_hunspell.py \
            --code uk --dic source-cache/uk_UA/uk_UA.dic \
            --aff source-cache/uk_UA/uk_UA.aff \
            --notice source-cache/uk_UA/README_uk_UA.txt \
            --origin "https://github.com/LibreOffice/dictionaries/tree/c0865a85eb67dc377f2cf8e8fe2c4fa9e53f0dcb/uk_UA" \
            --extra-themes data/cyrlex/uk_source_candidates.json \
            --apostrophe-chains --sample-words 100000 --out sourced-preview/uk
      - name: Validate WPD4 WPP2 40 themes and both source manifests
        run: |
          python3 tools/lang/dict_v4.py --verify sourced-preview/ru/dict.bin
          python3 tools/lang/dict_v4.py --verify sourced-preview/uk/dict.bin
          python3 tools/lang/pools_v2.py --verify sourced-preview/ru/dict.bin sourced-preview/ru/pools.bin
          python3 tools/lang/pools_v2.py --verify sourced-preview/uk/dict.bin sourced-preview/uk/pools.bin
          python3 tools/lang/install_cyr_preview.py --input-root sourced-preview --output-root staged-preview
          python3 - <<'PY'
          import json
          from pathlib import Path
          for code, count in (("ru", 229), ("uk", 222)):
              m = json.loads((Path("sourced-preview")/code/"SOURCE-MANIFEST.json").read_text())
              assert m["retained_word_count"] == 100000, m
              assert m["starter_password_count"] == 160, m
              assert m["extra_password_count"] == count, m
              assert m["total_password_count"] == 160 + count, m
              assert m["dictionary_bytes"] <= 1536*1024, m
              base = json.loads(Path(f"data/cyrlex/{code}_themes.json").read_text())
              extras = json.loads(Path(f"data/cyrlex/{code}_source_candidates.json").read_text())["themes"]
              assert len(base) == 40
              for theme in base:
                  words = theme["words"] + extras[theme["english"]]
                  assert any(8 <= len(word.replace("ʼ", "")) <= 9 for word in words), (code, theme)
              if code == "uk":
                  assert m["ukrainian_apostrophe_forms_retained"] > 0, m
                  assert m["apostrophe_password_count"] == 17, m
              else:
                  assert m["ukrainian_apostrophe_forms_retained"] == 0, m
                  assert m["apostrophe_password_count"] == 0, m
          print("SOURCED RU/UK OK: 100k words each, 389/382 attested password candidates; 17 Ukrainian apostrophe passwords")
          PY
      - name: Audit sourced Russian and Ukrainian themed-word review queue
        run: |
          python3 tools/lang/audit_sourced_cyr.py \
            --packs sourced-preview --min-source-words 100000 \
            --out build/cyr-native-review
      - name: Validate real 100k-word files in the actual native C password engine
        run: |
          gcc -std=gnu11 -O2 -Wall -Wextra -Wshadow -I source \
            tools/check/script_pass_test.c \
            source/script_board.c source/pools_v2.c source/tiles_v2.c source/dict_v4.c \
            -o sourced-script-pass-check
          ./sourced-script-pass-check \
            sourced-preview/ru/dict.bin sourced-preview/uk/dict.bin \
            sourced-preview/ru/tiles.bin sourced-preview/uk/tiles.bin \
            sourced-preview/ru/pools.bin sourced-preview/uk/pools.bin
      - name: Upload source dictionaries, original notices and tested packs
        uses: actions/upload-artifact@v7
        with:
          name: wordPass-ru-uk-sourced-lexicons
          path: |
            source-cache/
            sourced-preview/
            build/cyr-native-review/
          retention-days: 21

  sourced-rom:
    needs: source-packs
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20240511
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-ru-uk-sourced-lexicons
          path: .
      - name: Build opt-in Nintendo DS ROM with real RU/UK dictionary content
        run: |
          test -s sourced-preview/ru/dict.bin
          test -s sourced-preview/uk/dict.bin
          make clean
          make WP_CYR_PREVIEW=1 CYR_EXTERNAL_DIR=sourced-preview
          mv wordPass.nds wordPass-ru-uk-sourced-preview.nds
          mv wordPass.elf wordPass-ru-uk-sourced-preview.elf
          python3 tools/check/rom_budget.py \
            --rom wordPass-ru-uk-sourced-preview.nds \
            --elf wordPass-ru-uk-sourced-preview.elf \
            --mode preview --preview-root nitrofiles/cyrpreview \
            --nm "$DEVKITARM/bin/arm-none-eabi-nm" \
            --forbid-float-printf --output build/rom-budget-sourced.json
      - name: Upload sourced experimental ROM and attribution (not retail)
        uses: actions/upload-artifact@v7
        with:
          name: wordPass-real-RU-UK-experimental-ROM
          path: |
            wordPass-ru-uk-sourced-preview.nds
            wordPass-ru-uk-sourced-preview.elf
            build/rom-budget-sourced.json
            sourced-preview/ru/LICENSE-SOURCE.txt
            sourced-preview/uk/LICENSE-SOURCE.txt
            sourced-preview/ru/SOURCE-MANIFEST.json
            sourced-preview/uk/SOURCE-MANIFEST.json
            source-cache/SOURCE-LOCK.json
          retention-days: 21

  emulator:
    needs: sourced-rom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-real-RU-UK-experimental-ROM
          path: .
      - name: Install emulator and image checks
        run: python3 -m pip install py-desmume pillow numpy
      - name: Play real Russian and Ukrainian sourced word boards
        timeout-minutes: 23
        run: |
          python3 tools/emu/test_cyr_preview.py \
            wordPass-ru-uk-sourced-preview.nds sourced-preview-out
      - name: Complete source-backed Russian and Ukrainian tutorial lessons
        run: python3 tools/emu/test_cyr_training.py wordPass-ru-uk-sourced-preview.nds sourced-preview-out/training
      - name: Sourced Russian and Ukrainian checkpoints survive FAT reboot
        timeout-minutes: 10
        run: |
          python3 tools/emu/test_cyr_checkpoint.py \
            wordPass-ru-uk-sourced-preview.nds wordPass-ru-uk-sourced-preview.elf sourced-preview-out/checkpoints
      - name: Retain sourced-ROM emulator screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wordPass-ru-uk-sourced-screenshots
          path: sourced-preview-out/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  integrated-rom:
    needs: source-packs
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20240511
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-ru-uk-sourced-lexicons
          path: .
      - name: Build main-game 13-language candidate with real RU and UK packs
        run: |
          make clean
          make WP_CYR_MAIN=1 CYR_EXTERNAL_DIR=sourced-preview
          test -s nitrofiles/cyrpreview/ru/dict.bin
          test -s nitrofiles/cyrpreview/uk/dict.bin
          test "$(find nitrofiles/lang -name '*.bin' | wc -l)" -eq 30
          python3 tools/check/rom_budget.py \
            --rom wordPass.nds --elf wordPass.elf \
            --mode preview --preview-root nitrofiles/cyrpreview \
            --nm "$DEVKITARM/bin/arm-none-eabi-nm" \
            --forbid-float-printf --output build/rom-budget-integrated.json
          sha256sum wordPass.nds > wordPass.nds.sha256
      - name: Upload integrated main-game development candidate and notices
        uses: actions/upload-artifact@v7
        with:
          name: wordPass-13-language-main-candidate
          path: |
            wordPass.nds
            wordPass.elf
            wordPass.nds.sha256
            build/rom-budget-integrated.json
            sourced-preview/ru/LICENSE-SOURCE.txt
            sourced-preview/uk/LICENSE-SOURCE.txt
            sourced-preview/ru/SOURCE-MANIFEST.json
            sourced-preview/uk/SOURCE-MANIFEST.json
            source-cache/SOURCE-LOCK.json
          retention-days: 21

  integrated-emulator:
    needs: integrated-rom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-13-language-main-candidate
          path: .
      - name: Install emulator
        run: python3 -m pip install py-desmume pillow numpy
      - name: Test main menu, real languages, FAT persistence and shared game launches
        run: |
          sha256sum -c wordPass.nds.sha256
          python3 tools/emu/test_integrated_languages.py wordPass.nds wordPass.elf integrated-out
      - name: Upload integration screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wordPass-13-language-integration-screenshots
          path: integrated-out/*.png
          if-no-files-found: ignore
          retention-days: 7

  cjk-assets:
    if: github.event_name == 'workflow_dispatch' || contains(github.head_ref, '16-language')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate and test CJK assets
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-noto-cjk
          /usr/bin/python3 experiments/cjk/gen_assets.py --pack-dir cjk-packs
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Iexperiments/cjk/source -Iexperiments/cjk/generated experiments/cjk/test_core.c experiments/cjk/source/cjk_core.c -o /tmp/cjk-test
          /tmp/cjk-test
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -Iexperiments/cjk/source -Iexperiments/cjk/generated experiments/cjk/test_recovery.c experiments/cjk/source/cjk_core.c -o /tmp/cjk-recovery
          /tmp/cjk-recovery
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -Iexperiments/cjk/source experiments/cjk/test_fire.c experiments/cjk/source/cjk_core.c -o /tmp/cjk-fire
          /tmp/cjk-fire
          gcc -std=c11 -O2 -Wall -Wextra -Werror -DCJ_HINT_TEST -Iexperiments/cjk/source -Iexperiments/cjk/generated experiments/cjk/test_optimization.c experiments/cjk/source/cjk_core.c -o /tmp/cjk-optimization
          /tmp/cjk-optimization
          cp /usr/share/doc/fonts-noto-cjk/copyright cjk-packs/FONT-NOTICE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: wordPass-CJK-integration-assets
          path: cjk-packs/
  cjk-integrated-rom:
    needs: [source-packs, cjk-assets]
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20240511
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-ru-uk-sourced-lexicons
          path: .
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-CJK-integration-assets
          path: cjk-packs
      - name: Build combined 16-language candidate
        run: |
          make clean
          make WP_CJK_MAIN=1 CYR_EXTERNAL_DIR=sourced-preview CJK_ASSETS_DIR=cjk-packs
          test "$(find nitrofiles/cjk -name '*.bin' | wc -l)" -eq 3
          python3 tools/check/rom_budget.py --rom wordPass.nds --elf wordPass.elf --mode preview --preview-root nitrofiles/cyrpreview --nm "$DEVKITARM/bin/arm-none-eabi-nm" --forbid-float-printf --output build/rom-budget-integrated.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          budget=json.loads(Path("build/rom-budget-integrated.json").read_text())
          for p in Path("nitrofiles/cjk").glob("*.bin"):
              n=int.from_bytes(p.read_bytes()[4:6],"little")
              assert budget["linker_heap_span_bytes"]-p.stat().st_size-24*n >= 65536
          PY
          sha256sum wordPass.nds > wordPass.nds.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: wordPass-16-language-main-candidate
          path: |
            wordPass.nds
            wordPass.elf
            wordPass.nds.sha256
            build/rom-budget-integrated.json
            sourced-preview/ru/LICENSE-SOURCE.txt
            sourced-preview/uk/LICENSE-SOURCE.txt
            cjk-packs/FONT-NOTICE.txt
  cjk-integrated-emulator:
    needs: cjk-integrated-rom
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-16-language-main-candidate
          path: .
      - run: python3 -m pip install py-desmume pillow numpy
      - name: Existing integrated language regression
        run: python3 tools/emu/test_integrated_languages.py wordPass.nds wordPass.elf cjk-regression
      - name: Play all three new language choices
        run: python3 tools/emu/test_cjk_integration.py wordPass.nds wordPass.elf cjk-screens
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wordPass-16-language-screens
          path: cjk-screens/

  twenty-assets:
    if: contains(github.head_ref, '20-language')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate shaped Hindi, Hangul and native Latin packs
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-noto-cjk fonts-noto-core
          /usr/bin/python3 experiments/cjk/gen_extended.py --out twenty-packs
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -Iexperiments/cjk/source -Itwenty-packs experiments/cjk/test_extended.c experiments/cjk/source/cjk_core.c -o /tmp/extended-check
          /tmp/extended-check
          cp /usr/share/doc/fonts-noto-cjk/copyright twenty-packs/CJK-FONT-NOTICE.txt
          cp /usr/share/doc/fonts-noto-core/copyright twenty-packs/CORE-FONT-NOTICE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: wordPass-20-language-assets
          path: twenty-packs/
  twenty-rom:
    needs: [source-packs, twenty-assets]
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20240511
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-ru-uk-sourced-lexicons
          path: .
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-20-language-assets
          path: twenty-packs
      - name: Build unified twenty-language ROM
        run: |
          make clean
          make WP_20_MAIN=1 CYR_EXTERNAL_DIR=sourced-preview CJK_ASSETS_DIR=twenty-packs
          test "$(find nitrofiles/cjk -name '*.bin' | wc -l)" -eq 7
          python3 tools/check/audit_rom_languages.py wordPass.nds wordPass.elf --nm "$DEVKITARM/bin/arm-none-eabi-nm" --expected 20 --output build/language-packed-audit.json
          python3 tools/check/rom_budget.py --rom wordPass.nds --elf wordPass.elf --mode preview --preview-root nitrofiles/cyrpreview --nm "$DEVKITARM/bin/arm-none-eabi-nm" --forbid-float-printf --output build/rom-budget-integrated.json
          sha256sum wordPass.nds > wordPass.nds.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: wordPass-20-language-main-candidate
          path: |
            wordPass.nds
            wordPass.elf
            wordPass.nds.sha256
            build/rom-budget-integrated.json
            sourced-preview/ru/LICENSE-SOURCE.txt
            sourced-preview/uk/LICENSE-SOURCE.txt
            twenty-packs/*NOTICE.txt
            twenty-packs/EXTENDED-MANIFEST.json
            build/language-packed-audit.json
  twenty-emulator:
    needs: twenty-rom
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: wordPass-20-language-main-candidate
          path: .
      - run: python3 -m pip install py-desmume pillow numpy
      - name: Existing Latin and Cyrillic integration regression
        run: |
          sha256sum -c wordPass.nds.sha256
          python3 tools/emu/test_integrated_languages.py wordPass.nds wordPass.elf existing-out
      - name: Seven native-script language gameplay and save regression
        run: python3 tools/emu/test_cjk_integration.py wordPass.nds wordPass.elf extended-out 20
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wordPass-20-language-screens
          path: extended-out/*.png
